name: Bug report
description: Report reproducible non-security behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not report exploitable security vulnerabilities here. Please follow SECURITY.md."
  - type: input
    id: version
    attributes:
      label: IAQ Security Patrol version
    validations:
      required: true
  - type: input
    id: wordpress
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
